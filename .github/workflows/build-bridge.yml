name: Build FFI Bridge Libraries

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-linux-x64:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools

      - name: Install build tools
        run: |
          sudo apt-get install -y cmake g++ make

      - name: Build FFI Bridge
        run: |
          mkdir -p native/build-linux-x64
          cd native/build-linux-x64
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build . --config Release

      - name: Verify build
        run: |
          cd native/build-linux-x64
          file libCJQT6_bridge.so
          ldd libCJQT6_bridge.so || true

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: bridge-linux-x64
          path: native/build-linux-x64/libCJQT6_bridge.so

  build-windows-x64:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Qt6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.0'
          arch: win64_msvc2019_64
          modules: 'qtbase'

      - name: Build FFI Bridge
        run: |
          mkdir native\build-windows-x64
          cd native\build-windows-x64
          cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"
          cmake --build . --config Release

      - name: Verify build
        run: |
          cd native\build-windows-x64\Release
          dumpbin /headers CJQT6_bridge.dll || true

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: bridge-windows-x64
          path: native/build-windows-x64/Release/CJQT6_bridge.dll

  build-macos-x64:
    runs-on: macos-12
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Qt6
        run: |
          brew install qt@6

      - name: Build FFI Bridge
        run: |
          mkdir -p native/build-macos-x64
          cd native/build-macos-x64
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$(brew --prefix qt@6)
          cmake --build . --config Release

      - name: Verify build
        run: |
          cd native/build-macos-x64
          file libCJQT6_bridge.dylib
          otool -L libCJQT6_bridge.dylib || true

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: bridge-macos-x64
          path: native/build-macos-x64/libCJQT6_bridge.dylib

  build-macos-arm64:
    runs-on: macos-12
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Qt6
        run: |
          brew install qt@6

      - name: Build FFI Bridge (ARM64)
        run: |
          mkdir -p native/build-macos-arm64
          cd native/build-macos-arm64
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_PREFIX_PATH=$(brew --prefix qt@6)
          cmake --build . --config Release

      - name: Verify build
        run: |
          cd native/build-macos-arm64
          file libCJQT6_bridge.dylib
          otool -L libCJQT6_bridge.dylib || true

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: bridge-macos-arm64
          path: native/build-macos-arm64/libCJQT6_bridge.dylib

  collect-artifacts:
    needs: [build-linux-x64, build-windows-x64, build-macos-x64, build-macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Organize artifacts
        run: |
          mkdir -p lib/native/linux-x64
          mkdir -p lib/native/windows-x64
          mkdir -p lib/native/macos-x64
          mkdir -p lib/native/macos-arm64
          
          cp artifacts/bridge-linux-x64/libcjfw_bridge.so lib/native/linux-x64/ || true
          cp artifacts/bridge-windows-x64/cjfw_bridge.dll lib/native/windows-x64/ || true
          cp artifacts/bridge-macos-x64/libcjfw_bridge.dylib lib/native/macos-x64/ || true
          cp artifacts/bridge-macos-arm64/libcjfw_bridge.dylib lib/native/macos-arm64/ || true
          
          ls -R lib/native/

      - name: Generate checksums
        run: |
          cd lib/native
          find . -name "*.so" -o -name "*.dll" -o -name "*.dylib" | while read f; do
            sha256sum "$f" > "${f}.sha256"
          done
          cat *.sha256 */*.sha256 2>/dev/null || true

      - name: Upload organized artifacts
        uses: actions/upload-artifact@v3
        with:
          name: all-platform-binaries
          path: lib/native/
