# ============================================================
# CJQT6 CI Lint —— 快速静态检查(<30s)
# ------------------------------------------------------------
# 触发:任何 push/PR(无 paths 过滤) + workflow_dispatch
# 职责:
#   - cjfmt --check(格式)
#   - cjlint(语义)
# 与 ci.yml 的关系:
#   - docs-only / README / 注释改动只触发 ci-lint,跳过 ci.yml(节省 ~9 分钟)
#   - src/native/cjpm.toml 改动会同时触发 ci-lint 和 ci.yml(职责互补)
#   - ci.yml 用 paths 过滤仅跑 build+test,不再重复 lint(由本工作流覆盖)
# ------------------------------------------------------------

name: CI Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: cjfmt + cjlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: 安装仓颉 SDK 1.2.0
        uses: ./.github/actions/setup-cangjie
        with:
          os: linux
          version: "1.2.0"
          url-override: ${{ vars.CANGJIE_SDK_URL_LINUX }}

      - name: cjfmt 格式检查（src + examples + tools）
        run: |
          # 显式传入仓库配置 cangjie-format.toml：其取值当前与 SDK 默认一致（复检 0 差异），
          # 但不传 -c 时改这个文件不会对 CI 有任何影响——显式传入后它才是唯一事实来源。
          cjfmt -d src/ -c cangjie-format.toml
          cjfmt -d examples/ -c cangjie-format.toml
          cjfmt -d tools/ -c cangjie-format.toml
          git diff --exit-code src/ examples/ tools/

      - name: cjlint 静态检查（封装库）
        run: cjlint -f src/ -c .

      # examples/ 与 tools/ 是各自独立的 cjpm 工程;其中仅 CjMonitor 维护了示例级
      # 规则集（根白名单 − G.VAR.02/G.ITF.04,理由见其 config/README.md），故单独校验。
      - name: cjlint 静态检查（CjMonitor 示例）
        run: cjlint -f examples/CjMonitor/src -c examples/CjMonitor