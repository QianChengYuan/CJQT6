# ============================================================
# CJQT6 CI —— 四平台无人值守门禁(P0-2)
# ------------------------------------------------------------
# 触发:push/PR 到 main(仅源码/桥接变更),以及手动 workflow_dispatch。
# 平台:
#   - Linux x64 (ubuntu-24.04, GCC 13, Qt 6.4.2 gcc_64)
#   - Windows x64 (windows-2022, MSVC 2022, Qt 6.9.1 msvc2022_64)
#   - macOS arm64 (macos-14, Qt 6.4.2 clang_64 universal2)
#   - Linux arm64 (ubuntu-24.04-arm, 系统 Qt6)
# 流程:cache → 仓颉 SDK → Qt → 系统依赖 → bridge → cjpm pipeline
#       → offscreen 全量测试 → 上传桥接库产物。
# 覆盖:
#   - Linux/Windows/macOS bridge 层 C++ 单元测试均带 ASAN(P0-3,统一口径)
#   - Windows 独享覆盖率门禁(P0-1)
# 文档变更(.md、docs/、README、PERSONAL_NOTES 等)触发 ci-lint.yml,
# 本工作流不跑构建(节省 ~9 分钟/次)。
# ------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'native/**'
      - 'cjpm.toml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'scripts/build-*.sh'
      - 'scripts/build-*.ps1'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'native/**'
      - 'cjpm.toml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'scripts/build-*.sh'
      - 'scripts/build-*.ps1'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
  workflow_dispatch:

env:
  CANGJIE_VERSION: "1.1.0"
  QT_VERSION_LINUX: "6.4.2"
  QT_ARCH_LINUX: "gcc_64"
  QT_VERSION_MACOS: "6.4.2"
  QT_ARCH_MACOS: "clang_64"
  QT_VERSION_WINDOWS: "6.9.1"
  QT_ARCH_WINDOWS: "win64_msvc2022_64"

jobs:
  # ============================================================
  # Linux x86_64(GCC 13 · Qt 6.4.2)
  # ============================================================
  linux:
    name: Linux x64 (GCC 13 · Qt 6.4.2)
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    env:
      CJQT6_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      # cache:cjpm target + CMake build + Qt 安装包(~节省 5 分钟/次)
      - name: 缓存仓颉 cjpm + CMake build + Qt
        uses: actions/cache@v4
        with:
          path: |
            target/release
            target/release/cjqt6
            native/build_linux_x64
            ${{ runner.temp }}/Qt
          key: ci-linux-${{ env.CANGJIE_VERSION }}-${{ env.QT_VERSION_LINUX }}-${{ hashFiles('cjpm.toml','CMakeLists.txt','src/**/*.cj','native/src/**','native/includes/**') }}
          restore-keys: |
            ci-linux-${{ env.CANGJIE_VERSION }}-${{ env.QT_VERSION_LINUX }}-

      - name: 安装仓颉 SDK ${{ env.CANGJIE_VERSION }}
        uses: ./.github/actions/setup-cangjie
        with:
          os: linux
          version: ${{ env.CANGJIE_VERSION }}
          url-override: ${{ vars.CANGJIE_SDK_URL_LINUX }}

      - name: 安装 Qt ${{ env.QT_VERSION_LINUX }} (${{ env.QT_ARCH_LINUX }})
        uses: ./.github/actions/setup-qt
        with:
          os: linux
          version: ${{ env.QT_VERSION_LINUX }}
          arch: ${{ env.QT_ARCH_LINUX }}

      - name: 安装 Qt offscreen 运行依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1 libdbus-1-3 libglib2.0-0 \
            libxkbcommon0 libxkbcommon-x11-0 libxkbcommon-dev \
            libegl1 libgl1 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libgl1-mesa-dev libglvnd-dev libegl-dev libopengl-dev \
            libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 libgstreamer-gl1.0-0 \
            libgstreamer-plugins-good1.0-0 gstreamer1.0-gl \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - name: 编译 C++ FFI 桥接库
        run: bash scripts/build-linux-x64.sh

      - name: 编译并运行桥接层 C++ 单元测试(ASAN)
        run: bash scripts/build-native-tests.sh -asan

      - name: 仓颉构建+测试流水线
        uses: ./.github/actions/cjpm-pipeline
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_PLATFORM_PLUGIN_PATH: ${{ env.QTDIR }}/plugins/platforms
          QT_PLUGIN_PATH: ${{ env.QTDIR }}/plugins
          LD_LIBRARY_PATH: ${{ env.QTDIR }}/lib:${{ env.CANGJIE_HOME }}/runtime/lib/linux_x86_64_cjnative:${{ env.CANGJIE_HOME }}/tools/lib:${{ env.CJQT6_ROOT }}/releases/linux-x64

      - name: 诊断 Qt6Multimedia gstreamer 后端依赖
        if: always()
        run: |
          set +e
          echo "== gstreamer 插件缺失依赖 =="
          ldd "${{ env.QTDIR }}/plugins/multimedia/libgstreamermediaplugin.so" 2>&1 | grep -i "not found" || echo "(无缺失)"
          echo "== gst-inspect 探针 =="
          GST_PLUGIN_SYSTEM_PATH_1_0=/usr/lib/x86_64-linux-gnu/gstreamer-1.0 \
            gst-inspect-1.0 --version 2>&1 | head -2 || echo "gst-inspect 不可用"

      - name: 上传桥接库产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cjqt6-bridge-v${{ env.CANGJIE_VERSION }}-linux-x64
          path: releases/linux-x64/libcjqt6_bridge.so
          if-no-files-found: error

  # ============================================================
  # Windows x64(MSVC 2022 · Qt 6.9.1)
  # ============================================================
  windows:
    name: Windows x64 (MSVC 2022 · Qt 6.9.1)
    timeout-minutes: 60
    runs-on: windows-2022
    env:
      CJQT6_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: 缓存仓颉 cjpm + CMake build + Qt
        uses: actions/cache@v4
        with:
          path: |
            target\release
            target\release\cjqt6
            native\build_windows
            ${{ runner.temp }}\Qt
          key: ci-windows-${{ env.CANGJIE_VERSION }}-${{ env.QT_VERSION_WINDOWS }}-${{ hashFiles('cjpm.toml','CMakeLists.txt','src/**/*.cj','native/src/**','native/includes/**') }}
          restore-keys: |
            ci-windows-${{ env.CANGJIE_VERSION }}-${{ env.QT_VERSION_WINDOWS }}-

      - name: 安装仓颉 SDK ${{ env.CANGJIE_VERSION }}
        uses: ./.github/actions/setup-cangjie
        with:
          os: windows
          version: ${{ env.CANGJIE_VERSION }}
          url-override: ${{ vars.CANGJIE_SDK_URL_WINDOWS }}

      - name: 安装 Qt ${{ env.QT_VERSION_WINDOWS }} (${{ env.QT_ARCH_WINDOWS }})
        uses: ./.github/actions/setup-qt
        with:
          os: windows
          version: ${{ env.QT_VERSION_WINDOWS }}
          arch: ${{ env.QT_ARCH_WINDOWS }}

      - name: 编译 C++ FFI 桥接库 + 桥接层单元测试(ASAN)
        shell: pwsh
        run: .\scripts\update-bridge.ps1 -QtDir "${{ env.QTDIR }}" -RunTests -Asan

      - name: 仓颉构建+测试流水线(带覆盖率)
        uses: ./.github/actions/cjpm-pipeline
        with:
          coverage: "true"
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:\Windows\Fonts

      - name: 覆盖率门禁(P0-1,双口径阈值)
        if: success()
        shell: pwsh
        run: |
          if (Test-Path "cov_output\report\coverage.json") {
            .\scripts\check-coverage.ps1
          } else {
            Write-Host "::warning::coverage.json 不存在,跳过覆盖率门禁"
          }

      - name: 生成覆盖率摘要 markdown(PR 评论用)
        if: github.event_name == 'pull_request' && success()
        shell: pwsh
        run: |
          if (Test-Path "cov_output\report\coverage.json") {
            .\scripts\gen-coverage-summary.ps1
          } else {
            Write-Host "::warning::coverage.json 不存在,跳过 PR 评论 markdown 生成"
          }

      - name: 评论覆盖率到 PR(sticky comment,自动覆盖上一次)
        if: github.event_name == 'pull_request' && success()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: cov_output/report/pr_summary.md

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-windows
          path: cov_output/report/
          if-no-files-found: warn

      - name: 上传桥接库产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cjqt6-bridge-v${{ env.CANGJIE_VERSION }}-windows-x64
          path: releases/windows-x64/cjqt6_bridge.dll
          if-no-files-found: error

  # ============================================================
  # macOS Apple Silicon(arm64)
  # ============================================================
  macos-arm64:
    name: macOS arm64 (Apple Silicon · Qt 6.4.2)
    timeout-minutes: 60
    runs-on: macos-14
    env:
      CJQT6_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: 缓存仓颉 cjpm + CMake build + Qt
        uses: actions/cache@v4
        with:
          path: |
            target/release
            target/release/cjqt6
            native/build_macos_arm64
            ${{ runner.temp }}/Qt
          key: ci-macos-arm64-${{ env.CANGJIE_VERSION }}-${{ env.QT_VERSION_MACOS }}-${{ hashFiles('cjpm.toml','CMakeLists.txt','src/**/*.cj','native/src/**','native/includes/**') }}
          restore-keys: |
            ci-macos-arm64-${{ env.CANGJIE_VERSION }}-${{ env.QT_VERSION_MACOS }}-

      - name: 安装仓颉 SDK ${{ env.CANGJIE_VERSION }}
        uses: ./.github/actions/setup-cangjie
        with:
          os: macos
          version: ${{ env.CANGJIE_VERSION }}
          url-override: ${{ vars.CANGJIE_SDK_URL_MACOS }}
          sha-override: ${{ vars.CANGJIE_SDK_SHA_MACOS }}

      - name: 安装 Qt ${{ env.QT_VERSION_MACOS }} (${{ env.QT_ARCH_MACOS }})
        uses: ./.github/actions/setup-qt
        with:
          os: macos
          version: ${{ env.QT_VERSION_MACOS }}
          arch: ${{ env.QT_ARCH_MACOS }}

      - name: 编译 C++ FFI 桥接库
        run: bash scripts/build-macos-arm64.sh

      - name: 编译并运行桥接层 C++ 单元测试(ASAN)
        run: bash scripts/build-native-tests.sh -asan

      # 仓颉链接器 ld64.lld 默认 -syslibroot '/',需 SDKROOT 定位 macOS 系统库
      - name: 探测 macOS SDK 路径并写入 env
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      - name: 仓颉构建+测试流水线
        uses: ./.github/actions/cjpm-pipeline
        env:
          SDKROOT: ${{ env.SDKROOT }}
          QT_QPA_PLATFORM: offscreen
          QT_QPA_PLATFORM_PLUGIN_PATH: ${{ env.QTDIR }}/plugins/platforms
          QT_PLUGIN_PATH: ${{ env.QTDIR }}/plugins
          DYLD_LIBRARY_PATH: ${{ env.QTDIR }}/lib:${{ env.CJ_RUNTIME_LIB }}:${{ env.CANGJIE_HOME }}/tools/lib:${{ env.CJQT6_ROOT }}/releases/macos-arm64
          DYLD_FRAMEWORK_PATH: ${{ env.QTDIR }}/lib

      - name: 上传桥接库产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cjqt6-bridge-v${{ env.CANGJIE_VERSION }}-macos-arm64
          path: releases/macos-arm64/libcjqt6_bridge.dylib
          if-no-files-found: error

  # ============================================================
  # Linux ARM64(aarch64)
  # ============================================================
  linux-arm64:
    name: Linux arm64 (aarch64 · 系统 Qt6)
    timeout-minutes: 60
    runs-on: ubuntu-24.04-arm
    env:
      CJQT6_ROOT: ${{ github.workspace }}
      QTDIR: /usr/lib/aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: 缓存仓颉 cjpm + CMake build
        uses: actions/cache@v4
        with:
          path: |
            target/release
            target/release/cjqt6
            native/build_linux_arm64
          key: ci-linux-arm64-${{ env.CANGJIE_VERSION }}-${{ hashFiles('cjpm.toml','CMakeLists.txt','src/**/*.cj','native/src/**','native/includes/**') }}
          restore-keys: |
            ci-linux-arm64-${{ env.CANGJIE_VERSION }}-

      - name: 安装仓颉 SDK ${{ env.CANGJIE_VERSION }}
        uses: ./.github/actions/setup-cangjie
        with:
          os: linux-arm64
          version: ${{ env.CANGJIE_VERSION }}
          url-override: ${{ vars.CANGJIE_SDK_URL_LINUX_ARM64 }}

      - name: 安装 Qt6 系统开发包
        uses: ./.github/actions/setup-qt
        with:
          os: linux-arm64

      - name: 编译 C++ FFI 桥接库
        run: bash scripts/build-linux-arm64.sh

      - name: 仓颉构建+测试流水线
        uses: ./.github/actions/cjpm-pipeline
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_PLATFORM_PLUGIN_PATH: /usr/lib/aarch64-linux-gnu/qt6/plugins/platforms
          QT_PLUGIN_PATH: /usr/lib/aarch64-linux-gnu/qt6/plugins
          QML2_IMPORT_PATH: /usr/lib/aarch64-linux-gnu/qt6/qml
          LD_LIBRARY_PATH: /usr/lib/aarch64-linux-gnu:${{ env.CANGJIE_HOME }}/runtime/lib/linux_aarch64_cjnative:${{ env.CANGJIE_HOME }}/tools/lib:${{ env.CJQT6_ROOT }}/releases/linux-arm64

      - name: 上传桥接库产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cjqt6-bridge-v${{ env.CANGJIE_VERSION }}-linux-arm64
          path: releases/linux-arm64/libcjqt6_bridge.so
          if-no-files-found: error