# ============================================================
# CJQT6 CI —— 三端无人值守门禁（P0-2）
# ------------------------------------------------------------
# 触发：push/PR 到 main，以及手动 workflow_dispatch。
# 平台：
#   - Linux   (ubuntu-22.04, GCC 13, Qt 6.4.2 gcc_64)   —— 主仓 GitCode
#   - Windows (windows-2022, MSVC 2022, Qt 6.10.3 msvc2022_64) —— GitHub 镜像
# 流程：装仓颉 SDK → aqtinstall 装 Qt → 编译 bridge → cjpm build
#       → offscreen 全量测试（--coverage）→ cjcov 报告 → 上传产物。
#
# 前置说明（SDK 下载）：
#   官网下载页直链（https://cangjie-lang.cn/download/1.1.0/cangjie-sdk-*.tar.gz|zip）会 404，
#   页面"复制链接"给的是带临时签名的 URL，会过期。
#   稳定机制：cangjie-lang.cn 的 objectKey API
#     /v1/files/auth/downLoad?nsId=142267&fileName=<文件名>&objectKey=<objectKey>
#   无需签名、可长期使用（objectKey 内嵌在版本目录 JS 中，随版本固定）。
#   1.1.0 的 objectKey 已硬编码为默认值并校验 SHA-256；
#   若官方重新上传（objectKey 变更），在仓库 Variables 配
#     CANGJIE_SDK_URL_LINUX / CANGJIE_SDK_URL_WINDOWS 覆盖即可，无需改工作流。
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CANGJIE_VERSION: "1.1.0"
  # Linux: Qt 6.4.2（与 releases/linux-x64 锁定一致）；Windows: 6.10.3 msvc2022_64
  QT_VERSION_LINUX: "6.4.2"
  QT_ARCH_LINUX: "gcc_64"
  QT_VERSION_WINDOWS: "6.10.3"
  QT_ARCH_WINDOWS: "win64_msvc2022_64"

jobs:
  linux:
    name: Linux (GCC 13 · Qt 6.4.2)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CJQT6_ROOT: ${{ github.workspace }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载并解压仓颉 SDK 1.1.0
        shell: bash
        run: |
          set -euo pipefail
          # 默认用稳定的 objectKey API（无签名、不过期）；若官方重传导致 404，可用仓库变量覆盖
          url="${{ vars.CANGJIE_SDK_URL_LINUX }}"
          if [ -z "$url" ]; then
            url="https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-linux-x64-1.1.0.tar.gz&objectKey=69e9d50c21f5a8178d6fd219"
          fi
          mkdir -p "$RUNNER_TEMP/cangjie-sdk"
          curl -fL --retry 3 -o "$RUNNER_TEMP/cangjie-sdk.tar.gz" "$url"
          echo "5ce7e8c8523aad9cf5965f818249e1a39f10788963aef7c5852697a3ac964060  $RUNNER_TEMP/cangjie-sdk.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cangjie-sdk.tar.gz" -C "$RUNNER_TEMP/cangjie-sdk"
          CANGJIE_HOME="$(find "$RUNNER_TEMP/cangjie-sdk" -maxdepth 2 -name envsetup.sh -printf '%h\n' | head -n1)"
          echo "CANGJIE_HOME=$CANGJIE_HOME" >> "$GITHUB_ENV"
          echo "$CANGJIE_HOME/bin"      >> "$GITHUB_PATH"
          echo "$CANGJIE_HOME/tools/bin" >> "$GITHUB_PATH"
          # cjpm/cjc 启动依赖 SDK 运行时库（libcangjie-runtime.so 在 runtime/lib/linux_x86_64_cjnative）
          echo "LD_LIBRARY_PATH=$CANGJIE_HOME/runtime/lib/linux_x86_64_cjnative:$CANGJIE_HOME/tools/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "已安装到: $CANGJIE_HOME"

      - name: 安装系统依赖（Qt offscreen 运行所需）
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1 libdbus-1-3 libglib2.0-0 \
            libxkbcommon0 libxkbcommon-x11-0 libegl1 libgl1 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libgl1-mesa-dev libglvnd-dev libegl-dev libopengl-dev \
            libpulse-dev \
            libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - name: aqtinstall 安装 Qt ${{ env.QT_VERSION_LINUX }} (gcc_64)
        shell: bash
        run: |
          python3 -m pip install --user --quiet aqtinstall
          python3 -m aqt install-qt linux desktop \
            "${{ env.QT_VERSION_LINUX }}" "${{ env.QT_ARCH_LINUX }}" \
            -O "$RUNNER_TEMP/Qt" -m qtmultimedia
          QTDIR="$RUNNER_TEMP/Qt/${{ env.QT_VERSION_LINUX }}/${{ env.QT_ARCH_LINUX }}"
          echo "QTDIR=$QTDIR" >> "$GITHUB_ENV"
          echo "$QTDIR/bin" >> "$GITHUB_PATH"

      - name: 编译 C++ FFI 桥接库
        shell: bash
        env:
          QTDIR: ${{ env.QTDIR }}
        run: |
          QTDIR="${{ env.QTDIR }}" bash scripts/build-linux-x64.sh

      - name: 构建仓颉包
        shell: bash
        run: |
          cjpm build

      - name: 全量测试（offscreen，--coverage）
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_PLATFORM_PLUGIN_PATH: ${{ env.QTDIR }}/plugins/platforms
          QT_PLUGIN_PATH: ${{ env.QTDIR }}/plugins
          # 运行时需能找到桥接库 libcjqt6_bridge.so（在 releases/linux-x64，cjpm 不拷贝到测试 PATH）
          LD_LIBRARY_PATH: ${{ env.QTDIR }}/lib:${{ env.CANGJIE_HOME }}/runtime/lib/linux_x86_64_cjnative:${{ env.CJQT6_ROOT }}/releases/linux-x64
        run: |
          cjpm test --coverage

      - name: 生成覆盖率报告（cjcov）
        shell: bash
        run: |
          if [ ! -d cov_output ]; then
            echo "::warning::cov_output/ 不存在，跳过覆盖率报告"
            exit 0
          fi
          cjcov --root=cov_output --source=src \
            --output=cov_output/report --html-details --json --xml
          echo "覆盖率报告已生成: cov_output/report/index.html"

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: coverage-linux
          path: cov_output/report/
          if-no-files-found: warn

  windows:
    name: Windows (MSVC 2022 · Qt 6.10.3)
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CJQT6_ROOT: ${{ github.workspace }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载并解压仓颉 SDK 1.1.0
        shell: pwsh
        run: |
          # 默认用稳定的 objectKey API（无签名、不过期）；若官方重传导致 404，可用仓库变量覆盖
          $url = "${{ vars.CANGJIE_SDK_URL_WINDOWS }}"
          if ([string]::IsNullOrEmpty($url)) {
            $url = "https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-windows-x64-1.1.0.zip&objectKey=69e9d12b21f5a8178d6fd213"
          }
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\cangjie-sdk" | Out-Null
          curl.exe -fL --retry 3 -o "$env:RUNNER_TEMP\cangjie-sdk.zip" $url
          $expected = "3E2746B1C556441F1E0D8128CA23FE80A34583AFE2FA58A32F8ABB3B3C08B7E6"
          $actual = (Get-FileHash "$env:RUNNER_TEMP\cangjie-sdk.zip" -Algorithm SHA256).Hash
          if ($actual -ne $expected) { Write-Host "::error::SDK SHA-256 校验失败: $actual"; exit 1 }
          Expand-Archive -Path "$env:RUNNER_TEMP\cangjie-sdk.zip" -DestinationPath "$env:RUNNER_TEMP\cangjie-sdk"
          $envFile = Get-ChildItem "$env:RUNNER_TEMP\cangjie-sdk" -Recurse -Filter envsetup.ps1 | Select-Object -First 1
          if (-not $envFile) { Write-Host "::error::解压后未找到 envsetup.ps1"; exit 1 }
          $CANGJIE_HOME = $envFile.DirectoryName
          "CANGJIE_HOME=$CANGJIE_HOME" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$CANGJIE_HOME\bin"       | Out-File -FilePath $env:GITHUB_PATH -Append
          "$CANGJIE_HOME\tools\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          # cjpm/cjc 启动依赖 SDK 运行时库（libcangjie-runtime.dll 在 runtime\lib\windows_x86_64_cjnative）
          "$CANGJIE_HOME\runtime\lib\windows_x86_64_cjnative" | Out-File -FilePath $env:GITHUB_PATH -Append
          Write-Host "已安装到: $CANGJIE_HOME"

      - name: aqtinstall 安装 Qt ${{ env.QT_VERSION_WINDOWS }} (msvc2022_64)
        shell: pwsh
        run: |
          python -m pip install --quiet aqtinstall
          python -m aqt install-qt windows desktop `
            "${{ env.QT_VERSION_WINDOWS }}" "${{ env.QT_ARCH_WINDOWS }}" `
            -O "$env:RUNNER_TEMP\Qt" -m qtmultimedia
          # aqt 实际目录名可能与 arch 参数不一致（如 win64_msvc2022_64 → msvc2022_64），探测真实路径
          $qtBase = "$env:RUNNER_TEMP\Qt\${{ env.QT_VERSION_WINDOWS }}"
          $QTDIR = Get-ChildItem $qtBase -Directory | Where-Object { Test-Path "$($_.FullName)\bin\Qt6Core.dll" } | Select-Object -First 1
          if (-not $QTDIR) { Write-Host "::error::未找到 Qt 安装目录: $qtBase"; exit 1 }
          $QTDIR = $QTDIR.FullName
          "QTDIR=$QTDIR" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$QTDIR\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          Write-Host "QTDIR=$QTDIR"

      - name: 编译 C++ FFI 桥接库
        shell: pwsh
        run: |
          .\scripts\update-bridge.ps1 -QtDir "${{ env.QTDIR }}"

      - name: 构建仓颉包
        shell: pwsh
        run: |
          cjpm build

      - name: 部署 Qt 运行时 + 全量测试（offscreen，--coverage）
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:\Windows\Fonts
        run: |
          .\tests\deploy_qt_test.ps1 -RunTest -SkipBuild -QtDir "${{ env.QTDIR }}"

      - name: 生成覆盖率报告（cjcov）
        shell: pwsh
        run: |
          if (-not (Test-Path "cov_output")) {
            Write-Host "::warning::cov_output/ 不存在，跳过覆盖率报告"
            exit 0
          }
          cjcov --root=cov_output --source=src `
            --output=cov_output/report --html-details --json --xml
          Write-Host "覆盖率报告已生成: cov_output/report/index.html"

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: coverage-windows
          path: cov_output/report/
          if-no-files-found: warn
