# ============================================================
# cjpm.toml —— CJQT6（仓颉 Qt6 封装库）
# 本文件仅包含仓颉官方 cjpm 认可的字段，确保 cjpm 解析零警告。
# 非官方扩展配置请见同目录下的 cjqt6-ext.toml。
# ============================================================

[package]
  # ---- 必填字段 ----
  cjc-version = "1.1.0"          # 所需 cjc 最低版本
  name        = "cjqt6"          # 模块名（须与模块 root 包名一致）
  version     = "1.6.0"          # 模块版本（语义化）
  output-type = "dynamic"        # static / dynamic / executable

  # ---- 选填字段 ----
  description = "仓颉语言的 Qt6 封装库 - 让仓颉像 Python 使用 PyQt 一样便捷"
  authors     = ["CJQT6 Team"]
  license     = "MIT"            # 遵循 SPDX Identifier 规范

  homepage      = "https://gitcode.com/yuan_1992/CJQT6"
  repository    = "https://gitcode.com/yuan_1992/CJQT6.git"
  documentation = "https://gitcode.com/yuan_1992/CJQT6/blob/main/README.md"

  # 制品标签 / 分类（官方字段，原 [metadata] 内容合并至此）
  tag      = ["qt", "gui", "widgets", "ffi", "cross-platform"]
  category = "gui"

  # 编译 / 链接选项
  compile-option = "-Woff unused"
  link-option    = "C:/CodeTools/cangjie_git/CJQT6/releases/windows-x64/cjqt6_bridge.dll"

  # 源码 / 产物路径（使用官方字段，替代原 src-dir 等自定义项）
  src-dir    = "src"
  target-dir = "target"

  # 打包范围（gitignore 风格匹配规则）
  include = ["src", "docs", "examples", "native/includes", "releases"]
  exclude = ["*.txt", "*.log", "*.bak", "*.tmp", "test_*", "build_*"]

# ============================================================
# 依赖管理
# ============================================================
[dependencies]
  # 当前无远程仓颉依赖；如使用中心仓 / git / 本地仓颉库，按官方格式声明：
  # qt-helpers = "1.0.0"
  # some-lib   = { git = "https://...", branch = "main" }
  # local-lib  = { path = "./path/to/module" }

# 测试期依赖（仅 cjpm test 时生效）
[test-dependencies]

# 构建脚本依赖（供 build.cj 使用）
[script-dependencies]

# ============================================================
# 平台特定编译 / 链接选项
# 三元组可通过在对应平台执行 `cjc -v` 获取
# ============================================================

# Windows + MSVC
[target.x86_64-pc-windows-msvc]
  compile-option = ""
  link-option    = "releases/windows-x64/cjqt6_bridge.lib"

# Windows + MinGW（交叉编译）
[target.x86_64-pc-windows-gnu]
  compile-option = ""
  link-option    = "C:/CodeTools/cangjie_git/CJQT6/releases/windows-x64/cjqt6_bridge.dll"

# Linux x86_64
[target.x86_64-unknown-linux-gnu]
  compile-option = ""
  link-option    = "-Lreleases/linux-x64 -lcjqt6_bridge"

# macOS x86_64
[target.x86_64-apple-darwin]
  compile-option = ""
  link-option    = "-Lreleases/macos-x64 -lcjqt6_bridge"

# macOS Apple Silicon
[target.aarch64-apple-darwin]
  compile-option = ""
  link-option    = "-Lreleases/macos-arm64 -lcjqt6_bridge"

# Linux ARM64（交叉编译 / 原生）
[target.aarch64-unknown-linux-gnu]
  compile-option = ""
  link-option    = "-Lreleases/linux-arm64 -lcjqt6_bridge"

# ============================================================
# 平台隔离的依赖项（示例，按需启用）
# 语法：[target.<triple>[.<debug|release>].dependencies]
# ============================================================
# [target.x86_64-unknown-linux-gnu.dependencies]
#   some-linux-only-lib = "1.0.0"
#
# [target.x86_64-pc-windows-msvc.dependencies]
#   some-windows-only-lib = "1.0.0"
