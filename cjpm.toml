[package]
  name = "cjqt6"
  version = "1.0.0"
  description = "仓颉语言的Qt6封装库 - 让仓颉像Python使用PyQt一样便捷"
  author = "CJQT6 Team"
  license = "MIT"
  
  # 仓颉编译器版本要求
  cjc-version = "1.1.0"
  
  # 包输出类型
  output-type = "static"
  
  # 编译选项
  compile-option = "-Woff unused"
  link-option = "-lcjqt6_bridge"
  
  # 项目链接
  homepage = "https://gitcode.com/yuan_1992/CJQT6"
  repository = "https://gitcode.com/yuan_1992/CJQT6.git"
  documentation = "https://gitcode.com/yuan_1992/CJQT6/-/wikis/"
  
  # 关键词标签
  keywords = ["qt", "gui", "ui", "widgets", "ffi", "cross-platform"]
  
  # 打包范围
  include = ["src", "doc", "docs", "examples", "native/includes"]
  exclude = ["*.txt", "*.log", "*.bak", "*.tmp", "test_*", "build_*"]

[dependencies]
# 平台原生库包（条件依赖）
# 注意：暂时移除平台分包，采用单包策略
# 原生库将打包在主包内

# FFI桥接库配置
[native]
  bridge-name = "CJQT6_bridge"
  bridge-path = "lib/native"
  
  # 支持的平台列表
  platforms = [
    "linux-x64",
    "linux-arm64",
    "windows-x64",
    "macos-x64",
    "macos-arm64"
  ]

# 平台到二进制文件的映射
[native.binaries]
  linux-x64 = "lib/native/linux-x64/libCJQT6_bridge.so"
  linux-arm64 = "lib/native/linux-arm64/libCJQT6_bridge.so"
  windows-x64 = "lib/native/windows-x64/CJQT6_bridge.dll"
  macos-x64 = "lib/native/macos-x64/libCJQT6_bridge.dylib"
  macos-arm64 = "lib/native/macos-arm64/libCJQT6_bridge.dylib"

# 系统依赖要求
[requirements]
  qt6 = ">=6.2"
  cmake = ">=3.16"

# 平台特定要求
[requirements.platform.linux]
  glibc = ">=2.28"

[requirements.platform.windows]
  msvc = ">=2019"

[requirements.platform.macos]
  macos = ">=11.0"

# 安装后脚本
[install]
  post-install = "scripts/post_install.cj"
  verify-script = "scripts/verify_install.cj"

# 包元数据
[metadata]
  category = "gui"
  maturity = "stable"
  tags = ["desktop", "cross-platform", "native"]